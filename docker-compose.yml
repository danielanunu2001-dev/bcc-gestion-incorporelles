services:
  # ==================== BASE DE DONNÉES POSTGRESQL ====================
  postgres:
    image: postgres:16
    container_name: bcc_postgres
    restart: always
    environment:
      POSTGRES_DB: bcc_gestion
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Anunudaniel2001
      TZ: "Africa/Kinshasa"
    ports:
      - "5433:5432"
    volumes:
      - bcc-gestion-incorporelles_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bcc_gestion"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bcc_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==================== PGADMIN ====================
  pgadmin:
    image: dpage/pgadmin4
    container_name: bcc_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@bcc.cd
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      TZ: "Africa/Kinshasa"
    ports:
      - "5051:80"
    depends_on:
      - postgres
    volumes:
      - bcc_pgadmin_data:/var/lib/pgadmin
    networks:
      - bcc_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==================== REDIS ====================
  redis:
    image: redis:7-alpine
    container_name: bcc_redis
    restart: always
    command: redis-server --appendonly yes --requirepass redis_password_2024
    ports:
      - "6380:6379"
    volumes:
      - bcc_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bcc_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==================== REDIS INSIGHT ====================
  redis-insight:
    image: redis/redisinsight:latest
    container_name: bcc_redis_insight
    restart: always
    ports:
      - "5541:5540"
    volumes:
      - bcc_redis_insight_data:/db
    depends_on:
      - redis
    networks:
      - bcc_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==================== BACKEND ====================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bcc_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: Anunudaniel2001
      DB_NAME: bcc_gestion
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis_password_2024
      JWT_SECRET: mon_secret_super_secret_2025
      SESSION_SECRET: session_secret_pour_express_2025
      CORS_ORIGIN: http://localhost:3000,http://localhost:5173,http://localhost:3001
    ports:
      - "5001:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
      - ./backend/archives:/app/archives
    networks:
      - bcc_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==================== FRONTEND ====================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bcc_frontend
    restart: always
    environment:
      REACT_APP_API_URL: http://localhost:5001/api
      REACT_APP_ENV: production
    ports:
      - "3001:80"
    depends_on:
      - backend
    networks:
      - bcc_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ==================== VOLUMES ====================
volumes:
  bcc-gestion-incorporelles_postgres_data:
    external: true
    name: bcc-gestion-incorporelles_postgres_data
  bcc_pgadmin_data:
    external: true
    name: bcc_pgadmin_data
  bcc_redis_data:
    external: true
    name: bcc_redis_data
  bcc_redis_insight_data:
    external: true
    name: bcc_redis_insight_data

# ==================== NETWORKS ====================
networks:
  bcc_network:
    name: bcc_network
    driver: bridge